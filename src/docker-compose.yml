# One command, fully self-hosted. No external APIs; after the crawl the stack runs air-gapped.
#   make up       -> API/UI + Qdrant, Apertus at $LLM_BASE_URL (shared GPU box / sovereign endpoint)
#   make up-gpu   -> additionally serves Apertus locally with vLLM (needs an NVIDIA GPU, >=16 GB for 8B)

services:
  vllm:
    profiles: [gpu]
    # Apertus v1.5 needs the Swiss AI vLLM build until native support lands upstream
    image: ghcr.io/swiss-ai/vllm_apertus_1.5_release:latest-amd64
    command: >
      --model ${LLM_NAME:-swiss-ai/Apertus-v1.5-8B}
      --served-model-name ${LLM_NAME:-swiss-ai/Apertus-v1.5-8B}
      --max-model-len 32768
      --gpu-memory-utilization 0.85
      --enable-auto-tool-choice --tool-call-parser apertus
    environment:
      - HF_HOME=/models/hf
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - models:/models
    ports: ["8000:8000"]
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 30s
      retries: 40

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes:
      - qdrant:/qdrant/storage
    ports: ["6333:6333"]

  api:
    build: { context: ., dockerfile: app/Dockerfile }
    env_file: .env
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://vllm:8000/v1}
      - QDRANT_URL=http://qdrant:6333
      - HF_HUB_OFFLINE=1          # embedding model is baked into the image
    volumes:
      - ./data:/srv/data
      - ./config:/srv/config
      - ./eval:/srv/eval
    ports: ["8080:8080"]
    depends_on: [qdrant]

volumes:
  models:
  qdrant:
